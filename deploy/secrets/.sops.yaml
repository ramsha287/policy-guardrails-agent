# SOPS rules for the platform's Kubernetes Secrets. Only `data`/`stringData` values are
# encrypted, so names and keys stay readable in review.
# Replace the age recipients with your team's public keys (age-keygen -y key.txt). Add one
# recipient per person or CI system that may decrypt; keep production and staging separate.
creation_rules:
  - path_regex: production/.*\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1replace0with0your0production0recipient0public0key0000000000000000000000
  - path_regex: staging/.*\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1replace0with0your0staging0recipient0public0key000000000000000000000000
  - path_regex: .*\.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1replace0with0your0dev0recipient0public0key00000000000000000000000000000
