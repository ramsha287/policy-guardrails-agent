# Template for the release Secret (secrets.existingSecret in the chart). Copy it to
# <env>/guardrail-secrets.enc.yaml, fill it in, then encrypt it in place:
#   sops --encrypt --in-place production/guardrail-secrets.enc.yaml
# Never commit the unencrypted copy (.gitignore blocks *.dec.yaml and secrets.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: guardrail-secrets
  namespace: guardrails
type: Opaque
stringData:
  # Shared by gateways and the control plane. 32+ random characters:
  #   python -c "import secrets; print(secrets.token_urlsafe(32))"
  INTERNAL_TOKEN: ""
  # Fernet key for payloads held for human review:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  REVIEW_ENCRYPTION_KEY: ""
  # HMAC secret for the redaction service's `hash` mode. Rotating it changes every hash.
  HASH_SECRET: ""
  # From `python -m app.cli ai-gateway-credentials` (run once in the gateway container):
  AI_GATEWAY_PROJECT_ID: ""
  AI_GATEWAY_API_KEY: ""

  # In-chart Postgres (postgresql.enabled=true):
  POSTGRES_PASSWORD: ""

  # External Postgres (postgresql.enabled=false). One user per service is best; AUDIT_DSN only
  # needs SELECT on audit.audit_events.
  # GATEWAY_POSTGRES_DSN: postgresql+asyncpg://gateway:...@db.example:5432/guardrails
  # CONTROL_PLANE_POSTGRES_DSN: postgresql+asyncpg://control:...@db.example:5432/guardrails
  # AI_GATEWAY_POSTGRES_DSN: postgresql+asyncpg://aigateway:...@db.example:5432/guardrails
  # AUDIT_DSN: postgresql+asyncpg://audit_reader:...@db.example:5432/guardrails

  # External Redis (redis.enabled=false):
  # REDIS_URL: rediss://:password@redis.example:6380/0

  # Proxy mode only (gateway.proxy.enabled=true): the LLM provider key.
  # PROXY_UPSTREAM_API_KEY: ""
