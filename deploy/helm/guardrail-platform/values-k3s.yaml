# k3s (single cluster, 3 small nodes): in-chart Postgres on local-path storage, Traefik ingress,
# one control plane replica. Install:
#   helm upgrade --install guardrails deploy/helm/guardrail-platform -n guardrails --create-namespace \
#     -f deploy/helm/guardrail-platform/values-k3s.yaml --set secrets.existingSecret=guardrail-secrets
global:
  environment: production

postgresql:
  enabled: true
  storage:
    size: 20Gi
    storageClassName: local-path

redis:
  enabled: true

gateway:
  replicas: 2
  rateLimitPerMinute: 0
  ingress:
    enabled: false            # agents in the cluster call the service directly

controlPlane:
  replicas: 1
  pdb:
    enabled: false            # a PDB with one replica would block node drains
  ingress:
    enabled: true
    className: traefik
    host: guardrails.k3s.local
    tlsSecretName: ""         # add a TLS secret (e.g. from cert-manager) before exposing it

aiGateway:
  redaction:
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 1280Mi}
      limits: {memory: 2Gi}

mtls:
  mode: none                  # linkerd recommended once Linkerd is installed on the cluster

networkPolicy:
  enabled: true               # k3s enforces NetworkPolicies (kube-router)
  ingressControllerNamespace: kube-system

monitoring:
  podAnnotations: true
