{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- range $name, $spec := dict "gateway" .Values.gateway "control-plane" .Values.controlPlane }}
{{- if $spec.enabled }}
{{- $c := dict "root" $ "component" $name }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gp.name" $c }}
  labels:
    {{- include "gp.labels" $c | nindent 4 }}
    {{- with $.Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "gp.selectorLabels" $c | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.monitoring.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gp.name" (dict "root" $ "component" "alerts") }}
  labels:
    {{- include "gp.labels" (dict "root" $ "component" "alerts") | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/prometheus/guardrail-alerts.yaml" | nindent 2 }}
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gp.name" (dict "root" $ "component" "dashboards") }}
  labels:
    {{- include "gp.labels" (dict "root" $ "component" "dashboards") | nindent 4 }}
    {{- toYaml .Values.monitoring.grafanaDashboard.labels | nindent 4 }}
data:
  {{- (.Files.Glob "files/grafana/*.json").AsConfig | nindent 2 }}
{{- end }}
