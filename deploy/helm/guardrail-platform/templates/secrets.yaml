{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Dev/k3s trials only. Production: a SOPS-encrypted Secret applied separately (deploy/secrets)
# and secrets.existingSecret set to its name.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gp.secretName" . }}
  labels: {{- include "gp.labels" (dict "root" $ "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
