[project]
name = "memory-firewall"
version = "0.1.0"
description = "Memory firewall MVP: verify agent memory before loading it (isolated lab)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "cryptography>=50.0.2",
    "datasets>=5.1.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pycryptodome>=3.24.1",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab", "src/guard", "src/scan", "src/eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
lab-baseline = "eval.run_baseline:main"
lab-try = "lab.try_agent:main"
lab-attack = "eval.run_attacks:main"
lab-fp = "eval.run_fp:main"
vec-attack = "eval.run_vector_attack:main"
vec-guard = "eval.run_vector_guard:main"
scan-eval = "eval.run_scan:main"
report = "eval.make_report:main"
llm-demo = "eval.run_llm_demo:main"
demo = "eval.run_demo:main"
