# Credentials (API keys, tokens, private keys, passwords) in any stage. In-process, deterministic.
id: secrets
version: 1.0.0
kind: local
description: >
  Finds credentials by their published formats (AWS, GitHub, Slack, OpenAI, Anthropic, Stripe,
  Google, JWTs, PEM private keys, database URLs with a password, gk_/cpk_ platform keys) and
  high-entropy password/token assignments. Redacts them (MODIFY) or blocks the request.
owner: ai-security
data_handling: >
  Runs in the gateway process. Sends nothing anywhere and stores nothing. Findings carry the
  secret type, offsets and location, never the value.
stages: [input, retrieval, tool, output]
decisions_emitted: [allow, modify, block]
failure_mode: fail_closed
latency_budget_ms: 20
capabilities:
  emits_modify: true
  needs_raw_payload: true
  parallel_safe: false
  max_payload_kb: 1024
entrypoint: app.plugins.secrets.guardrail:SecretsGuardrail
config_schema:
  type: object
  additionalProperties: false
  properties:
    on_detect: {enum: [modify, block], default: modify, description: redact the secret, or block the request}
    block_types:
      type: array
      items: {type: string}
      default: [PRIVATE_KEY]
      description: secret types that always block (AWS_ACCESS_KEY, AWS_SECRET_KEY, GITHUB_TOKEN, SLACK_TOKEN, ANTHROPIC_KEY, OPENAI_KEY, STRIPE_KEY, GOOGLE_API_KEY, PLATFORM_KEY, JWT, CONNECTION_STRING, PRIVATE_KEY, PASSWORD_ASSIGNMENT)
    ignore_types: {type: array, items: {type: string}, description: detectors to switch off}
    min_entropy: {type: number, minimum: 0, maximum: 8, default: 3.0, description: bits per character for password/token assignments}
    scan_tool_arguments: {type: boolean, default: true}
    scan_tool_result: {type: boolean, default: true}
