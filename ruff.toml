line-length = 120
target-version = "py311"
# The existing ai-gateway services keep their own style; lint only the new platform code.
extend-exclude = ["services/ai-gateway"]

[lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "UP042"]

[lint.per-file-ignores]
# One-shot admin CLIs: blocking file I/O inside async main is fine.
"**/cli.py" = ["ASYNC230", "ASYNC240"]

[lint.isort]
known-first-party = ["app", "guardrail_sdk", "tests"]
