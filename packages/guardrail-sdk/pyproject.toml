[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-sdk"
version = "1.0.0"
description = "Contracts, base class, conformance suite and agent client for the custom guardrail platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "cryptography>=42", "uvicorn>=0.29"]

[project.scripts]
guardrail = "guardrail_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["guardrail_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
