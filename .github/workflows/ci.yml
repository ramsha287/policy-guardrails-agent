name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check services/guardrail-gateway packages/guardrail-sdk

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.4.2
      - run: opa fmt --list --fail policies
      - run: opa test policies -v

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "packages/guardrail-sdk[test]"
      - run: pytest packages/guardrail-sdk -q
      - name: Sample agent against a fake gateway (live cases skip here; see e2e job)
        run: pytest tests/e2e -q

  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_TEST_DSN: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e packages/guardrail-sdk -r services/guardrail-gateway/requirements-dev.txt
      - name: Unit + integration tests (includes the ai-gateway-pii conformance suite)
        working-directory: services/guardrail-gateway
        run: pytest -q
      - name: Type check
        # Non-blocking until the first green run with the full dependency set.
        continue-on-error: true
        working-directory: services/guardrail-gateway
        run: mypy app

  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d control_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_TEST_DSN: postgresql+asyncpg://gateway:gateway@localhost:5432/control_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e packages/guardrail-sdk -r services/guardrail-control-plane/requirements-dev.txt
      - name: Service rules (in-memory + every flow again on PostgreSQL) and HTTP API
        working-directory: services/guardrail-control-plane
        run: pytest -q
      - name: Type check
        continue-on-error: true
        working-directory: services/guardrail-control-plane
        run: mypy app

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser smoke test against the mock control plane (every screen, light/dark, phone width)
        run: |
          npx playwright install --with-deps chromium
          SCREENSHOTS=screenshots npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: apps/console/screenshots
          if-no-files-found: ignore

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: OPA policies in the chart match policies/
        run: diff -u policies/guardrails/authz.rego deploy/helm/guardrail-platform/files/policies/authz.rego
      - name: Lint (defaults, k3s, cloud)
        working-directory: deploy/helm/guardrail-platform
        run: |
          helm lint . --set secrets.create=true
          helm lint . -f values-k3s.yaml --set secrets.existingSecret=s
          helm lint . -f values-cloud.yaml
      - name: Render and validate against the Kubernetes schemas
        working-directory: deploy/helm/guardrail-platform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for f in "--set secrets.create=true" "-f values-k3s.yaml --set secrets.existingSecret=s" \
                   "-f values-cloud.yaml" "-f values-k3s.yaml --set secrets.existingSecret=s --set mtls.mode=app --set mtls.app.certManager.enabled=true"; do
            echo "== $f"
            helm template guardrails . $f > /tmp/out.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/out.yaml
          done
      - name: Alert rules are valid PromQL
        run: |
          docker run --rm -v "$PWD/deploy/helm/guardrail-platform/files/prometheus:/rules" --entrypoint promtool \
            prom/prometheus:v2.54.1 check rules /rules/guardrail-alerts.yaml

  security:
    # Report-only until the first baseline is triaged (docs/security/pentest-plan.md).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Python dependencies (known vulnerabilities)
        run: |
          for r in services/guardrail-gateway/requirements.txt services/guardrail-control-plane/requirements.txt \
                   services/ai-gateway/project-service/requirements.txt services/ai-gateway/instant-redaction-service/requirements.txt; do
            echo "== $r"; pip-audit -r "$r" --progress-spinner off || true
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Console dependencies
        working-directory: apps/console
        run: npm install --no-audit --no-fund && npm audit --omit=dev || true
      - name: Filesystem scan (secrets, misconfigurations, vulnerabilities)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"

  ai-gateway:
    # Real Presidio + spaCy en_core_web_lg; project-service and API keys are faked.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway/instant-redaction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r requirements-dev.txt && python -m spacy download en_core_web_lg
      - run: pytest -q

  e2e:
    # Full docker compose stack + sample agent + evaluation set. Runs on main and on demand.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [gateway, control-plane, console, ai-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start the stack
        run: |
          docker compose up --build -d
          timeout 900 sh -c 'until curl -sf localhost:8100/ready >/dev/null; do sleep 5; done'
      - run: pip install -e "packages/guardrail-sdk[test]"
      - name: Sample agent + control-plane changes against the live stack
        run: |
          export GUARDRAIL_E2E_URL=http://localhost:8100 CONTROL_PLANE_E2E_URL=http://localhost:8200
          export GUARDRAIL_E2E_KEY=$(docker compose exec -T guardrail-gateway sh -c '. /bootstrap/dev.env; echo $DEMO_GATEWAY_API_KEY')
          export CP_E2E_ADMIN_KEY=$(docker compose exec -T guardrail-control-plane sh -c '. /bootstrap/cp.env; echo $CP_ADMIN_KEY')
          pytest tests/e2e -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Console against the live control plane (read-only + one simulation)
        working-directory: apps/console
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          export CONSOLE_URL=http://localhost:8200
          export CONSOLE_ADMIN_KEY=$(docker compose exec -T guardrail-control-plane sh -c '. /bootstrap/cp.env; echo $CP_ADMIN_KEY')
          npm run e2e
      - name: Precision / recall on the labelled set (requirement D)
        # Report-only until the first baseline is recorded; then drop continue-on-error and
        # set MIN_PRECISION / MIN_RECALL to the agreed thresholds.
        continue-on-error: true
        working-directory: services/guardrail-gateway
        run: |
          pip install -r requirements.txt
          eval "$(docker compose exec -T guardrail-gateway cat /bootstrap/dev.env | grep -E '^AI_GATEWAY_(API_KEY|PROJECT_ID)=' | sed 's/^/export /')"
          PYTHONPATH=. guardrail evaluate \
            --manifest app/plugins/ai_gateway_pii/guardrail-1.1.0.yaml \
            --config ../../eval/ai-gateway-pii.config.json \
            --dataset ../../eval/datasets/pii_v1.jsonl \
            --min-precision ${MIN_PRECISION:-0.85} --min-recall ${MIN_RECALL:-0.85} \
            --report ../../eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
      - if: failure()
        run: docker compose logs --no-color --tail=200

  images:
    runs-on: ubuntu-latest
    needs: [lint, sdk, gateway, control-plane]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build guardrail-gateway (amd64 + arm64 for k3s nodes)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/guardrail-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build guardrail-control-plane (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/guardrail-control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build instant-redaction-service
        uses: docker/build-push-action@v6
        with:
          context: services/ai-gateway/instant-redaction-service
          push: false
      - name: Build project-service
        uses: docker/build-push-action@v6
        with:
          context: services/ai-gateway/project-service
          push: false
